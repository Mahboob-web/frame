<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bano Qabil Gujrat — Graduation Frame 2026</title>
<style>
:root{color-scheme:light;--green:#075338;--gold:#e9c33d}*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#153c2b;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:780px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 25px #1232}.head{text-align:center;margin-bottom:14px}.head h1{font-size:clamp(20px,4vw,28px);margin:4px 0;color:var(--green)}.head p{margin:6px 0;color:#53655b}.preview{width:min(100%,540px);margin:0 auto 16px;line-height:0}.preview canvas{width:100%;height:auto;border-radius:4px;display:block;background:#e8eee9}.controls{display:grid;gap:13px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#edf2ee;color:var(--green);border:1px solid #b7c7bd}input[type=file]{width:100%;padding:10px;border:1px dashed #a7b8ad;border-radius:10px;background:#fafcfb}label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}input[type=range]{width:100%;accent-color:var(--green)}.hint{font-size:13px;line-height:1.5;color:#5e6e64;margin:0}.status{font-size:13px;color:#52675a;min-height:18px}.footer{text-align:center;font-size:12px;color:#6b786f;margin:14px 0 2px}
</style></head><body><main class="wrap"><section class="card"><header class="head"><h1>Bano Qabil Gujrat</h1><p>Graduation Ceremony 2026 — Photo Frame</p><p class="hint">Upload your photo, adjust it inside the circle, then download your poster.</p></header><div class="preview"><canvas id="canvas" width="1536" height="1536" aria-label="Graduation poster preview"></canvas></div><div class="controls"><div><label for="photo">1. Choose your photo</label><input id="photo" type="file" accept="image/*"></div><div><label for="zoom">2. Zoom photo</label><input id="zoom" type="range" min="0.7" max="2.5" step="0.01" value="1"></div><div class="row"><button class="btn secondary" id="left">← Left</button><button class="btn secondary" id="right">Right →</button><button class="btn secondary" id="up">↑ Up</button><button class="btn secondary" id="down">↓ Down</button></div><p class="hint">Tip: Use the arrows to position your face. Your photo stays in your browser and is not uploaded to a server.</p><div class="row"><button class="btn primary" id="download">Download poster (PNG)</button><button class="btn secondary" id="reset">Reset photo</button></div><div id="status" class="status" role="status"></div></div></section><p class="footer">Bano Qabil Gujrat · Graduation Ceremony 2026</p></main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const frame=new Image();frame.src='/frame-overlay.png';let photo=null,zoom=1,ox=0,oy=0;const cx=768,cy=670,r=300;let ready=false;
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(photo){ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();const scale=Math.max((2*r)/photo.width,(2*r)/photo.height)*zoom;const dw=photo.width*scale,dh=photo.height*scale;ctx.drawImage(photo,cx-dw/2+ox,cy-dh/2+oy,dw,dh);ctx.restore();}else{ctx.save();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dfe7e2';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 180px Georgia';ctx.fillText('＋',cx,cy);ctx.restore();}if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0,canvas.width,canvas.height);}
frame.onload=()=>{ready=true;draw()};document.getElementById('photo').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file);const p=new Image();p.onload=()=>{photo=p;zoom=1;ox=0;oy=0;document.getElementById('zoom').value='1';draw();document.getElementById('status').textContent='Photo added. Adjust it and download your poster.';URL.revokeObjectURL(url)};p.onerror=()=>{document.getElementById('status').textContent='Could not open this image. Please choose another.';URL.revokeObjectURL(url)};p.src=url});document.getElementById('zoom').addEventListener('input',e=>{zoom=Number(e.target.value);draw()});function move(dx,dy){ox+=dx;oy+=dy;draw()}document.getElementById('left').onclick=()=>move(-15,0);document.getElementById('right').onclick=()=>move(15,0);document.getElementById('up').onclick=()=>move(0,-15);document.getElementById('down').onclick=()=>move(0,15);document.getElementById('reset').onclick=()=>{photo=null;zoom=1;ox=0;oy=0;document.getElementById('photo').value='';document.getElementById('zoom').value='1';document.getElementById('status').textContent='Reset complete.';draw()};document.getElementById('download').onclick=()=>{if(!photo){document.getElementById('status').textContent='Please choose your photo first.';return}draw();canvas.toBlob(blob=>{if(!blob){document.getElementById('status').textContent='Download could not be created. Try another browser.';return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Bano-Qabil-Graduation-2026.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.getElementById('status').textContent='Your poster is ready to share!'},'image/png')};draw();
</script></body></html>
